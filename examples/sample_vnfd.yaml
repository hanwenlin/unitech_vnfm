tosca_definitions_version: tosca_simple_yaml_1_2

metadata:
  template_name: SampleVNF
  template_author: L-VNFM
  template_version: "1.0.0"

description: A sample VNF descriptor for L-VNFM

topology_template:
  node_templates:
    VDU1:
      type: tosca.nodes.nfv.Vdu.Compute
      properties:
        name: vdu1
        flavor: m1.small
        image: ubuntu-22.04
      capabilities:
        virtual_compute:
          properties:
            virtual_cpu:
              num_virtual_cpu: 2
            virtual_memory:
              virtual_mem_size: 4 GB

    CP1:
      type: tosca.nodes.nfv.VduCp
      properties:
        layer_protocols: [ipv4]
      requirements:
        - virtual_binding: VDU1
        - virtual_link: VL1

    VL1:
      type: tosca.nodes.nfv.VnfVirtualLink
      properties:
        connectivity_type:
          layer_protocol: ipv4
        description: Management network

  policies:
    - scaling_policy:
        type: tosca.policies.nfv.VnfIndicator
        targets: [VDU1]
        properties:
          name: auto_scale
          scaling_type: scale_out
          threshold: 80
